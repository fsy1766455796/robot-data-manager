<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ロボットデータ管理室</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/"><span class="brand-icon">▦</span><span>ロボットデータ<span class="brand-sub">管理室</span></span></a><div class="nav-label">ライブラリ</div><nav><button class="nav active" data-tab="map"><span>▧</span> 地図カタログ <b id="map-count">—</b></button><button class="nav" data-tab="bag"><span>◉</span> rosbag カタログ <b id="bag-count">—</b></button><button class="nav" data-tab="trash"><span>↶</span> 一時保管・復元</button></nav><div class="sidebar-bottom"><span class="dot"></span> ローカルで実行中<p>データはこのコンピューターで処理されます。</p><span class="version">TASK 60 · DATA CATALOG</span></div></aside>
<main><header><div class="eyebrow">つくばチャレンジ / データ整理</div><div class="header-row"><div><h1 id="page-title">地図カタログ</h1><p id="page-description">地図を見比べて、必要なデータを見つける。</p></div><div class="header-actions"><button id="refresh" class="button primary">↻ 再スキャン</button></div></div></header>
<section class="source-bar"><label for="source">データソース</label><select id="source"></select><span id="mode" class="badge"></span><span id="source-path"></span></section>
<div id="notice" class="notice"></div><div id="errors" role="alert"></div>
<section class="stats"><div><span id="stat-label">地図セット</span><strong id="stat-count">—</strong><small id="stat-sub">関連画像・設定をフォルダー単位で表示</small></div><div><span>合計ファイル容量</span><strong id="stat-size">—</strong><small>選択中のソース・タブの合計</small><div class="disk-space"><span id="disk-label">SSD の空き容量</span><b id="disk-free">—</b><small id="disk-total"></small></div></div></section>
<section class="toolbar"><div class="search-wrap"><span>⌕</span><input id="search" type="search" placeholder="名前・パス・トピックを検索" aria-label="検索"></div><select id="sort" aria-label="並べ替え"><option value="date-desc">日付：新しい順</option><option value="date-asc">日付：古い順</option><option value="pixels-asc">画素数：少ない順</option><option value="pixels-desc">画素数：多い順</option><option value="size-desc">容量：大きい順</option><option value="size-asc">容量：小さい順</option><option value="name">名前順</option></select></section>
<div class="result-bar"><span id="result-count"></span><span id="view-hint">「詳細を見る」で画像と関連ファイルを確認できます。</span></div><section id="content" class="grid" aria-live="polite"></section><footer>画像の画素数だけで不要な地図とは判断しません。場所と用途を確認してください。</footer></main>
<dialog id="detail"><div class="dialog-head"><div><span id="detail-type" class="eyebrow"></span><h2 id="detail-title"></h2></div><button id="close" class="icon-button" aria-label="閉じる">×</button></div><div id="detail-body"></div><div class="dialog-footer"><span id="detail-policy"></span><button id="quarantine" class="button danger">フォルダーを一時保管へ</button></div></dialog>
<div id="toast" role="status"></div>
</body></html>
